tests:
  - id: catalog-kr-categories-get
    description: Fetch KR catalog categories
    request:
      method: GET
      path: /v1/catalog/categories
      query:
        locale: ko_KR
        category: 전자제품
    expect:
      status: 200
      assertions:
        - path: $.status
          op: equals
          value: OK
        - path: $.categories
          op: notEmpty
