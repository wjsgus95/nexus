name: catalog-kr
targetUrl: https://catalog.staging.kr.internal
stableUrl: https://catalog.prod.kr.internal
healthPath: /actuator/health

diffRules:
  ignoredPaths:
    - $.request_id
    - $.timestamp
    - $.meta.traceId
    - $.data.cacheAgeMs

kafka:
  topic: traffic.catalog.kr
  maxMessages: 100
  timeoutSeconds: 15
  offsetReset: latest
  autoNoiseDetection: true
