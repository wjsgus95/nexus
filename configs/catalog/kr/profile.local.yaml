name: catalog-kr
targetUrl: http://127.0.0.1:18080/target
stableUrl: http://127.0.0.1:18080/stable
healthPath: /actuator/health

diffRules:
  ignoredPaths:
    - $.request_id
    - $.timestamp
    - $.meta.traceId
    - $.data.cacheAgeMs

kafka:
  topic: traffic.catalog.kr
  maxMessages: 10
  timeoutSeconds: 5
  offsetReset: latest
  autoNoiseDetection: true
