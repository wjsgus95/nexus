name: pricing-kr
targetUrl: https://pricing.staging.kr.internal
stableUrl: https://pricing.prod.kr.internal
healthPath: /actuator/health

diffRules:
  ignoredPaths:
    - $.request_id
    - $.timestamp
    - $.meta.traceId
    - $.quotedAt

kafka:
  topic: traffic.pricing.kr
  maxMessages: 100
  timeoutSeconds: 15
  offsetReset: latest
  autoNoiseDetection: true
