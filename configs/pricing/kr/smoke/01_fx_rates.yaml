tests:
  - id: pricing-kr-fx-rate-get
    description: Fetch KR currency exchange rate
    request:
      method: GET
      path: /v1/pricing/rates
      query:
        currency: KRW
    expect:
      status: 200
      assertions:
        - path: $.currency
          op: equals
          value: KRW
        - path: $.rate
          op: gt
          value: 0
