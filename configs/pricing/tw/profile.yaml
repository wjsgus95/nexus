name: pricing-tw
targetUrl: https://pricing.staging.tw.internal
stableUrl: https://pricing.prod.tw.internal
healthPath: /actuator/health

diffRules:
  ignoredPaths:
    - $.request_id
    - $.timestamp
    - $.meta.traceId
    - $.quotedAt

kafka:
  topic: traffic.pricing.tw
  maxMessages: 100
  timeoutSeconds: 15
  offsetReset: latest
  autoNoiseDetection: true
